variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CI_POETRY_VERSION: 2.5.1
  DLM_SERVER_REF: a114d699d2dfbbfbd6b11d1b5ab6537ce6359d7b

# Enable caching for python
cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - .cache/pip

stages:
  - build
  - test
  - lint
  - publish
  - pages
  - scan

include:
    # Python
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/python.gitlab-ci.yml'

    # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'

    # Tag Based GitLab Release Management
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'

    # Build and push the docker image
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/oci-image.gitlab-ci.yml'

    # Build and push the Helm chart
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/helm-chart.gitlab-ci.yml'

    # .post step finalisers eg: badges
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'

# Disabling for now so that pipelines can run on the AWS
# oci-image-build:
#   tags:
#     - ska-default # force the job onto the ska-default runners

python-test:
  stage: test
  image: docker:27.0.2-dind
  services:
    - docker:27.0.2-dind
  before_script:
    - docker compose -p dlm-client-unit -f tests/testrunner.docker-compose.yaml -f tests/unit-compose.override.yaml build
    - docker compose -p dlm-client-unit -f tests/testrunner.docker-compose.yaml -f tests/unit-compose.override.yaml up -d --wait etcd
  script:
    - docker compose -p dlm-client-unit -f tests/testrunner.docker-compose.yaml -f tests/unit-compose.override.yaml run --rm --entrypoint="pytest --ignore tests/integration" dlm_client_testrunner
  after_script:
    - docker compose -p dlm-client-unit -f tests/testrunner.docker-compose.yaml -f tests/unit-compose.override.yaml down --volumes --remove-orphans

integration-tests:
  stage: test
  image: docker:27.0.2-dind
  services:
    - docker:27.0.2-dind
  before_script:
    - apk add --no-cache make bash git
  script:
    - make integration-test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - unknown_failure
