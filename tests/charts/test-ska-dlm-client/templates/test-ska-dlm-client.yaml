apiVersion: v1
kind: Pod
metadata:
  name: {{ include "test-ska-dlm-client.fullname" . }}-setup-dlm
  labels:
    {{- include "test-ska-dlm-client.directory-watcher.labels" . | indent 8 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
  - name: setup-dlm
    image: {{ .Values.ska_dlm_client.image }}:{{ .Values.ska_dlm_client.version }}
    imagePullPolicy: {{ .Values.ska_dlm_client.imagePullPolicy }}
    volumeMounts:
      - name: test-configmap
        mountPath: "/dlm"
        readOnly: true
    command:
    - /app/.venv/bin/python
    - /dlm/setup_dlm.py
    - "--storage-name"
    - {{ .Values.directory_watcher.source_name | quote }}
    - "--storage-url"
    - {{ .Values.directory_watcher.storage_url | quote }}
    - "--storage-root-directory"
    - {{ .Values.directory_watcher.directory_to_watch | quote }}
  volumes:
    - name: test-configmap
      configMap:
        name: {{ include "test-ska-dlm-client.fullname" . }}-configmap
