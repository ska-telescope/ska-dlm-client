include:
  - path: test_services.docker-compose.yaml
  - path: integration/dlm_servers.docker-compose.yaml


services:

  dlm_configdb_watcher:
    platform: linux/amd64
    image: dlm_client
    container_name: dlm_configdb_watcher
    hostname: ska-dlm-configdb-watcher
    env_file:
      - configdb_watcher.env
    entrypoint:
      - /entrypoint.sh
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./registration_processor/product_dir:/dlm/product_dir
    networks:
      - dlm_network
    depends_on:
      etcd:
        condition: service_healthy
      dlm_storage:
        condition: service_healthy

  dlm_directory_watcher:
    platform: linux/amd64
    image: dlm_client
    container_name: dlm_directory_watcher
    hostname: ska-dlm-directory-watcher
    env_file:
      - directory_watcher.env
    entrypoint: /entrypoint.sh
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dlm_network
    depends_on:
      dlm_storage:
        condition: service_healthy
