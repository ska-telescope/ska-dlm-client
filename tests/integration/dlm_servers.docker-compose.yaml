# wrapper/top-level integration stack
include:
  - path: dlm_services.docker-compose.yaml

services:
  dlm_migration:
    platform: linux/amd64
    image: ${SERVER_IMAGE}
    user: root
    container_name: dlm_migration
    environment:
      - LOGLEVEL=${LOGLEVEL:-INFO}
    entrypoint: uvicorn ska_dlm.dlm_migration.dlm_migration_requests:rest --host 0.0.0.0 --port 8004
    ports:
      - 8004:8004
    volumes:
      - $PWD/tests/integration/ska-dlm-home:/home/ska-dlm
      - $PWD/tests/integration/ska-dlm-home/.dlm:/root/.dlm
    depends_on:
      dlm_migrations:
        condition: service_completed_successfully
      dlm_postgrest:
        condition: service_started
      dlm_rclone:
        condition: service_started
    networks:
      - dlm_network

  dlm_storage:
    platform: linux/amd64
    image: ${SERVER_IMAGE}
    container_name: dlm_storage
    user: root
    environment:
      - SSH_PUBLIC_KEY_PATH=/dlm/.ssh/id_rsa.pub
      - LOGLEVEL=${LOGLEVEL:-INFO}
    entrypoint: uvicorn ska_dlm.dlm_storage.dlm_storage_requests:rest --host 0.0.0.0 --port 8003
    ports:
      - 8003:8003
    volumes:
      - shared-tmpfs:/dlm
      - $PWD/tests/integration/ska-dlm-home/.dlm:/root/.dlm
      - $PWD/tests/integration/ska-dlm-home:/home/ska-dlm
    depends_on:
      dlm_migrations:
        condition: service_completed_successfully
      dlm_postgrest:
        condition: service_started
      dlm_rclone:
        condition: service_started
    networks:
      - dlm_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8003' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  dlm_request:
    image: ${SERVER_IMAGE}
    container_name: dlm_request
    user: root
    platform: linux/amd64
    environment:
      - LOGLEVEL=${LOGLEVEL:-INFO}
    entrypoint: uvicorn ska_dlm.dlm_request.dlm_request_requests:rest --host 0.0.0.0 --port 8002
    ports:
      - 8002:8002
    volumes:
      - $PWD/tests/integration/ska-dlm-home/.dlm:/root/.dlm
      - $PWD/tests/integration/ska-dlm-home:/home/ska-dlm
    depends_on:
      dlm_migrations:
        condition: service_completed_successfully
      dlm_postgrest:
        condition: service_started
      dlm_rclone:
        condition: service_started
    networks:
      - dlm_network

  dlm_ingest:
    platform: linux/amd64
    image: ${SERVER_IMAGE}
    container_name: dlm_ingest
    user: root
    environment:
      - LOGLEVEL=${LOGLEVEL:-INFO}
    entrypoint: uvicorn ska_dlm.dlm_ingest.dlm_ingest_requests:rest --host 0.0.0.0 --port 8001
    ports:
      - 8001:8001
    volumes:
      - $PWD/tests/integration/ska-dlm-home/.dlm:/root/.dlm
      - $PWD/tests/integration/ska-dlm-home:/home/ska-dlm
    depends_on:
      dlm_migrations:
        condition: service_completed_successfully
      dlm_postgrest:
        condition: service_started
      dlm_rclone:
        condition: service_started
    networks:
      - dlm_network

  dlm_migrations:
    platform: linux/amd64
    image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle-migrations:2.1.0-dev.c7c7e7352
    container_name: dlm_migrations
    command: >
      --url="jdbc:postgresql://dlm_db:5432/ska_dlm_testing"
      --username="ska_dlm_admin"
      --password="password"
      --driver=org.postgresql.Driver
      --search-path=/changelog
      --changelog-file=changelog.yaml
      update
      --context-filter="create-schema,unprivileged"
    depends_on:
      dlm_db:
        condition: service_healthy
    networks:
      - dlm_network
  dlm_heuristics:
    platform: linux/amd64
    image: ${SERVER_IMAGE}
    container_name: dlm_heuristics
    command: ["ska-dlm-heuristics"]
    user: root
    environment:
      - LOGLEVEL=${LOGLEVEL:-INFO}
      - DLM_HEURISTIC_DATABASE_URL=${DLM_HEURISTIC_DATABASE_URL:-postgresql+asyncpg://ska_dlm_admin:password@dlm_db:5432/ska_dlm_testing}
      - DLM_HEURISTIC_POLL_INTERVAL=${DLM_HEURISTIC_POLL_INTERVAL:-10}
    depends_on:
      dlm_db:
        condition: service_healthy
      dlm_migrations:
        condition: service_completed_successfully
      dlm_postgrest:
        condition: service_started
      dlm_rclone:
        condition: service_started
    networks:
      - dlm_network

  dlm_outbox:
    platform: linux/amd64
    image: ${SERVER_IMAGE}
    container_name: dlm_outbox
    environment:
      DLM_OUTBOX_DATABASE_URL: "postgresql+asyncpg://ska_dlm_admin:password@dlm_db:5432/ska_dlm"
      DLM_OUTBOX_RABBITMQ_URL: "amqp://guest:guest@rabbitmq/"
      DLM_OUTBOX_POLL_INTERVAL: "10"
      DLM_OUTBOX_BATCH_SIZE: "50"
      DLM_OUTBOX_EXCHANGE: "dlm.outbox"
    entrypoint: ["python", "-m", "ska_dlm.dlm_outbox.relay"]
    volumes:
      - shared-tmpfs:/dlm
      - $PWD/tests/integration/ska-dlm-home/.dlm:/root/.dlm
      - $PWD/tests/integration/ska-dlm-home:/home/ska-dlm
    depends_on:
      dlm_db:
        condition: service_healthy
      dlm_migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ska-dlm --help || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network