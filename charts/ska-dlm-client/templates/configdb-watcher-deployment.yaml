{{- if .Values.configdb_watcher.enabled -}}
{{- $etcd_url := .Values.configdb_watcher.sdp_config.etcd_url | default "" | trim -}}
{{- $local_etcd_enabled := .Values.configdb_watcher.sdp_config.local_etcd.enabled -}}

{{- if and $local_etcd_enabled (ne $etcd_url "") -}}
{{- fail "Invalid config: choose ONE etcd option for configdb_watcher. Either set configdb_watcher.sdp_config.etcd_url and set configdb_watcher.sdp_config.local_etcd.enabled=false, OR leave configdb_watcher.sdp_config.etcd_url empty and set configdb_watcher.sdp_config.local_etcd.enabled=true." -}}
{{- end -}}

{{- if and (not $local_etcd_enabled) (eq $etcd_url "") -}}
{{- fail "Invalid config: configdb_watcher.enabled=true but no etcd configured. Either set configdb_watcher.sdp_config.etcd_url for external etcd OR set configdb_watcher.sdp_config.local_etcd.enabled=true to deploy local etcd." -}}
{{- end -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "ska-dlm-client.fullname" . }}-configdb-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm-client.configdb-watcher.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
  selector:
    component: {{ .Values.configdb_watcher.component }}
    subsystem: {{ .Values.configdb_watcher.subsystem }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ska-dlm-client.fullname" . }}-configdb-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm-client.configdb-watcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.configdb_watcher.replicas }}
  selector:
    matchLabels:
      component: {{ .Values.configdb_watcher.component }}
      subsystem: {{ .Values.configdb_watcher.subsystem }}
  template:
    metadata:
      labels:
        {{- include "ska-dlm-client.configdb-watcher.labels" . | nindent 8 }}
    spec:
      dnsPolicy: ClusterFirst

      # if bringing up a local etcd service, wait for the pod to be ready
      {{ if .Values.configdb_watcher.sdp_config.local_etcd.enabled }}
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            {{ include "ska-dlm-client.configdb-watcher.sdp-config-env" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for etcd at ${ETCD_URL}..."
              ETCD_ADDR="${ETCD_URL#http://}"
              ETCD_ADDR="${ETCD_ADDR#https://}"
              ETCD_HOST="${ETCD_ADDR%%:*}"
              ETCD_PORT="${ETCD_ADDR##*:}"
              echo "ETCD_HOST=${ETCD_HOST}"
              echo "ETCD_PORT=${ETCD_PORT}"
              until nc -z -w 2 "${ETCD_HOST}" "${ETCD_PORT}"; do
                sleep 2
              done
              echo "etcd service is ready."

      {{ end }}

      containers:
      - name: configdb-watcher
        image: {{ .Values.ska_dlm_client.image }}:{{ .Values.ska_dlm_client.version }}
        imagePullPolicy: {{ .Values.ska_dlm_client.imagePullPolicy }}

        env:
          # Where ska_sdp_config.Config() should look for etcd / ConfigDB
          {{- include "ska-dlm-client.configdb-watcher.sdp-config-env" . | nindent 10 }}

          - name: LOCATION_NAME
            value: {{ .Values.global.location_name | quote }}

          - name: INGEST_URL
            value: {{ .Values.configdb_watcher.ingest_url | quote }}

          - name: STORAGE_URL
            value: {{ .Values.configdb_watcher.storage_url | quote }}

          - name: SOURCE_NAME
            value: {{ .Values.configdb_watcher.source_name | quote }}

          - name: DIRECTORY_TO_WATCH
            value: {{ .Values.configdb_watcher.directory_to_watch | quote }}

          {{- if .Values.configdb_watcher.target_name }}
          - name: TARGET_NAME
            value: {{ .Values.configdb_watcher.target_name | quote }}
          {{- end }}

          {{- if .Values.configdb_watcher.migration_url }}
          - name: MIGRATION_URL
            value: {{ .Values.configdb_watcher.migration_url | quote }}
          {{- end }}

          {{- if .Values.configdb_watcher.include_existing }}
          - name: INCLUDE_EXISTING
            value: "true"
          {{- end }}

          - name: WATCHER_HOSTNAME
            value: {{ include "ska-dlm-client.fullname" . }}-configdb-watcher.{{ .Release.Namespace }}

          {{- if .Values.configdb_watcher.uid_expiration_days }}
          - name: UID_EXPIRATION_DAYS
            value: {{ .Values.configdb_watcher.uid_expiration_days | quote }}
          {{- end }}

          {{- if .Values.configdb_watcher.oid_expiration_days }}
          - name: OID_EXPIRATION_DAYS
            value: {{ .Values.configdb_watcher.oid_expiration_days | quote }}
          {{- end }}

        command:
          - /entrypoint.sh
        args:
          - configdb-watcher

        volumeMounts:
          - name: data-product-storage
            mountPath: /dlm/product_dir
            {{- if $.Values.configdb_watcher.pvc.read_only }}
            readOnly: true
            {{- end }}

      volumes:
        - name: data-product-storage
          persistentVolumeClaim:
            claimName: "{{ $.Values.configdb_watcher.pvc.name }}"

{{- end }}
